<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veterinary Assistant 1 | Certification Prep Center</title><style>
:root{--navy:#0c2340;--rose:#c27373;--sage:#92b0a9;--cream:#f7f4ef;--ink:#23313d;--line:#d7e3df}*{box-sizing:border-box}body{margin:0;font:16px/1.55 Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f6f5}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:700}button:focus-visible,input:focus-visible{outline:3px solid #c27373;outline-offset:2px}.primary{background:var(--navy);color:white}.secondary{background:#e4efec;color:var(--navy)}.rose{background:var(--rose);color:#fff}.ghost{background:white;border:1px solid var(--line);color:var(--navy)}button:disabled{opacity:.55;cursor:default}.wrap{max-width:1150px;margin:auto;padding:18px}.hero{background:var(--navy);color:white;border-radius:16px;padding:30px;margin-bottom:16px}.hero h1{margin:3px 0;font-size:clamp(25px,4vw,38px)}.hero p{margin:8px 0;color:#e6efed}.eyebrow{color:#b9d4ce;font-size:12px;font-weight:bold;letter-spacing:1.8px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:17px}.tabs button.active{background:var(--navy);color:white}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:14px}.card h2,.card h3{color:var(--navy);margin-top:0}.muted{color:#536472}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}.standard{border-left:6px solid var(--sage)}.standard.heavy{border-left-color:var(--rose)}.pill{display:inline-block;border-radius:20px;background:#e4efec;color:#24463f;font-size:12px;font-weight:bold;padding:3px 9px}.tag{display:inline-block;border-radius:20px;background:#f7e8e6;color:#813f41;font-size:12px;font-weight:bold;padding:3px 9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.bar{height:13px;background:#e1e8e6;border-radius:15px;overflow:hidden}.fill{height:100%;background:var(--sage);transition:width .2s}.question{border:1px solid var(--line);border-radius:12px;padding:17px;margin:13px 0}.option{display:block;width:100%;text-align:left;background:#f6f8f7;border:1px solid var(--line);margin:8px 0;color:var(--ink);font-weight:normal}.option.chosen{border-color:var(--navy);background:#e6efed}.option.correct{border-color:#2f8c68;background:#e3f4eb}.option.wrong{border-color:#bd5353;background:#fff0f0}.feedback{padding:13px;background:var(--cream);border-radius:9px;margin-top:10px}.flash{min-height:160px;display:grid;place-content:center;text-align:center;background:var(--cream);border:2px dashed var(--sage);border-radius:12px;padding:25px;font-size:21px}.small{font-size:13px}.hidden{display:none!important}.footer{padding:25px;text-align:center;color:#667}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{background:#e4efec;border-left:5px solid var(--sage);padding:13px;border-radius:8px}.warning{background:#fdf0ed;border-left:5px solid var(--rose);padding:13px;border-radius:8px}details{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}summary{cursor:pointer;font-weight:bold;color:var(--navy)}.stat{font-size:28px;font-weight:bold;color:var(--navy)}@media(max-width:600px){.wrap{padding:10px}.hero{padding:20px}.card{padding:15px}}
</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">VETERINARY ASSISTANT 1 • EXAM 124</div><h1>🩺 Certification Prep Center</h1><p>Your exam. Your pace. Your preparation.</p><p class="small">OPTIONAL • SELF-PACED • UNGRADED • ORIGINAL PRACTICE MATERIALS</p></header><nav class="tabs" aria-label="Review sections" id="tabs"></nav><main id="main" aria-live="polite"></main><footer class="footer">Veterinary Assistant 1B • Independent certification review • Not affiliated with or endorsed by YouScience</footer></div><script src="data.js"></script><script>
'use strict';const KEY='vet-cert-prep-v1',MIX=[1,0,7,9,8,4,4,3,2,4,3,3];let state={completed:[],last:3,results:{},flash:{},mock:null,history:[]};try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object')state={...state,...saved}}catch(e){}let page='home',current=3,cardIdx=0,flipped=false,practice=[],answers={},checked=false,exam=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));$('save-status')&&($('save-status').textContent='Saved on this device')}catch(e){$('save-status')&&($('save-status').textContent='Browser storage unavailable — export your progress')}};const s=n=>STANDARDS.find(x=>x.id===n);function nav(p,n){if(n)current=n;page=p;render();window.scrollTo({top:0,behavior:'instant'})}function btn(t,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${esc(t)}</button>`}function progress(){return Math.round(state.completed.length/12*100)}function render(){const tabs=[['home','Dashboard'],['library','Study Library'],['flash','Flashcards'],['practice','Topic Practice'],['mock','Mock Exam'],['backup','Save / Transfer']];$('tabs').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':'ghost'}" onclick="nav('${k}')">${t}</button>`).join('');$('main').innerHTML=({home:home,library:library,flash:flash,practice:practicePage,mock:mockPage,backup:backup})[page]();}
function home(){return `<div class="grid"><section class="card"><h2>Welcome back!</h2><p class="muted">Pick up where you left off. Progress is saved automatically in this browser.</p><div class="stat">${state.completed.length} / 12</div><p>Standards marked reviewed</p><div class="bar"><div class="fill" style="width:${progress()}%"></div></div><div class="actions">${btn('Continue Studying →',`openStandard(${state.last||3})`)} ${btn('Open Mock Exam',"nav('mock')",'secondary')}</div><p class="small" id="save-status">Saved on this device</p></section><section class="card"><h2>Exam at a glance</h2><p><strong>48 items • 54 points</strong> on the published blueprint.</p><p>The largest categories are <strong>Anatomy & Physiology (19%)</strong>, <strong>Health & Disease (17%)</strong>, and <strong>Medical Terminology (15%)</strong>.</p><p class="small">Blueprint percentages are rounded. Practice scores are not official certification scores or passing predictions.</p></section></div><div class="card"><h2>Choose a standard</h2><div class="grid">${STANDARDS.map(x=>`<div class="card standard ${x.weight>=15?'heavy':''}" style="margin:0"><span class="${x.weight>=15?'tag':'pill'}">${x.weight}% blueprint weight</span><h3>${x.id}. ${esc(x.name)}</h3><p class="small">${esc(x.focus)}</p>${state.completed.includes(x.id)?'<p>✓ Marked reviewed</p>':''}${btn('Study this standard',`openStandard(${x.id})`,'secondary')}</div>`).join('')}</div></div><div class="note">This is an optional, ungraded study resource. No work is submitted to Canvas. A student may use any section in any order.</div>`}
function library(){return `<section class="card"><h2>Study Library</h2><p>Choose a standard to read its review notes, see a clinical example, and check the certification blueprint focus. Prioritize the higher-weight standards, but review every area.</p></section><div class="grid">${STANDARDS.map(x=>`<section class="card standard ${x.weight>=15?'heavy':''}"><span class="pill">Standard ${x.id} • ${x.weight}%</span><h3>${esc(x.name)}</h3><p>${esc(x.focus)}</p>${btn('Open study section',`openStandard(${x.id})`,'secondary')}</section>`).join('')}</div>`}
function openStandard(n){current=n;state.last=n;save();page='library';const x=s(n);$('tabs').innerHTML=$('tabs').innerHTML;render();$('main').innerHTML=`<div class="actions">${btn('← All standards',"nav('library')",'ghost')}</div><section class="card"><span class="pill">STANDARD ${n} • ${x.weight}% of blueprint</span><h2>${esc(x.name)}</h2><h3>What to understand</h3><p>${esc(x.study)}</p><h3>Apply it: real-world example</h3><p class="note">${esc(x.case)}</p><p class="small">Blueprint category: ${esc(x.name)} (${x.weight}% of published exam weighting). Review the official standards document for its full objectives and performance expectations.</p><div class="warning"><strong>Scope of practice:</strong> This review teaches recognition and safe decisions. Students must not diagnose, prescribe, administer drugs, restrain animals, or perform procedures without appropriate training, authorization and supervision.</div><div class="actions">${btn(state.completed.includes(n)?'✓ Reviewed — click to unmark':'Mark section reviewed',`toggleReviewed(${n})`)} ${btn('Practice questions',`startPractice(${n})`,'secondary')} ${btn('Study flashcards',`startFlash(${n})`,'secondary')}</div></section>`}
function toggleReviewed(n){state.completed=state.completed.includes(n)?state.completed.filter(v=>v!==n):[...state.completed,n];save();openStandard(n)}
function startFlash(n){current=n;state.last=n;cardIdx=0;flipped=false;save();page='flash';render()}function flash(){const x=s(current),q=x.questions[cardIdx%x.questions.length];return `<section class="card"><h2>Flashcards</h2><p>Use these cards to recall important concepts. Choose a standard:</p><div class="controls"><select id="flash-standard" onchange="startFlash(+this.value)" aria-label="Choose standard">${STANDARDS.map(a=>`<option value="${a.id}" ${a.id===current?'selected':''}>${a.id}. ${esc(a.name)}</option>`).join('')}</select></div><p class="small">Card ${cardIdx+1} of ${x.questions.length}</p><div class="flash" role="status">${flipped?esc(q.options[q.a]+' — '+q.why):esc(q.q)}</div><div class="actions">${btn(flipped?'Show question':'Reveal answer',"flipCard()")}${btn('Next card →',"nextCard()",'secondary')}</div></section>`}function flipCard(){flipped=!flipped;render()}function nextCard(){cardIdx=(cardIdx+1)%s(current).questions.length;flipped=false;state.flash[current]=cardIdx;save();render()}
function startPractice(n){current=n;state.last=n;practice=s(n).questions.map((q,i)=>({...q,standard:n,key:`${n}-${i}`}));answers={};checked=false;save();page='practice';render()}function practicePage(){if(!practice.length)return `<section class="card"><h2>Topic Practice</h2><p>Choose a standard for immediate-feedback practice questions.</p><div class="grid">${STANDARDS.map(x=>`<div class="card"><strong>${x.id}. ${esc(x.name)}</strong><p>${x.questions.length} questions</p>${btn('Start practice',`startPractice(${x.id})`,'secondary')}</div>`).join('')}</div></section>`;return questionUI(practice,'topic')}
function questionUI(items,mode){const done=mode==='topic'?checked:!!state.mock?.submitted;let score=0;items.forEach((q,i)=>{if(answers[i]===q.a)score++});return `<section class="card"><h2>${mode==='topic'?`Practice: ${esc(s(current).name)}`:'48-Question Mock Certification Exam'}</h2><p class="muted">${items.length} original practice questions. ${mode==='mock'?'This practice test is not the official exam.':''}</p>${done?`<div class="note"><strong>Result: ${score} / ${items.length} (${Math.round(score/items.length*100)}%)</strong><br>Review the explanations below and revisit weak topics.</div>`:''}${items.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.q)}</strong>${q.options.map((op,j)=>`<button class="option ${answers[i]===j?'chosen':''} ${done&&j===q.a?'correct':''} ${done&&answers[i]===j&&j!==q.a?'wrong':''}" ${done?'disabled':''} onclick="chooseAnswer(${i},${j},'${mode}')">${String.fromCharCode(65+j)}. ${esc(op)}</button>`).join('')}${done?`<div class="feedback"><strong>Answer: ${esc(q.options[q.a])}</strong><br>${esc(q.why)} <span class="small">(Standard ${q.standard})</span></div>`:''}</div>`).join('')}<div class="actions">${!done?btn(`Check ${mode==='mock'?'mock exam':'my answers'}`,`submitQuestions('${mode}')`):btn(mode==='mock'?'Start a new mock exam':'Try again',mode==='mock'?'newMock()':`startPractice(${current})`,'secondary')}${btn('Back to dashboard',"nav('home')",'ghost')}</div></section>`}
function chooseAnswer(i,j,mode){answers[i]=j;if(mode==='mock'&&state.mock&&!state.mock.submitted){state.mock.answers=answers;save()}render()}
function submitQuestions(mode){if(Object.keys(answers).length<(mode==='mock'?exam:practice).length){if(!confirm('Some questions are unanswered. Submit anyway?'))return}if(mode==='topic'){checked=true;state.results[current]={correct:practice.filter((q,i)=>answers[i]===q.a).length,total:practice.length,date:new Date().toISOString()}}else{state.mock.submitted=true;state.mock.answers=answers;state.mock.score=exam.filter((q,i)=>answers[i]===q.a).length;state.history.unshift({date:new Date().toISOString(),score:state.mock.score,total:exam.length});state.history=state.history.slice(0,20)}save();render()}
function seededShuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(y=>y.x)}function buildExam(){const result=[];STANDARDS.forEach((x,i)=>{const qs=seededShuffle(x.questions.map((q,j)=>({...q,standard:x.id,key:`${x.id}-${j}`})));result.push(...qs.slice(0,MIX[i]))});return seededShuffle(result)}function newMock(){if(state.mock&&!state.mock.submitted&&Object.keys(state.mock.answers||{}).length&&!confirm('Start over? Your unfinished mock exam will be replaced.'))return;exam=buildExam();answers={};state.mock={keys:exam.map(q=>q.key),answers:{},submitted:false};save();page='mock';render()}function restoreExam(){if(!state.mock)return;exam=(state.mock.keys||[]).map(key=>{const [n,i]=key.split('-').map(Number),q=s(n)?.questions[i];return q?{...q,standard:n,key}:null}).filter(Boolean);answers={...(state.mock.answers||{})}}function mockPage(){if(state.mock&&(!exam.length||exam.length!==state.mock.keys.length))restoreExam();if(!state.mock||!exam.length)return `<section class="card"><h2>Mock Certification Exam</h2><p>48 original practice questions, distributed approximately according to the published blueprint. There is no time limit or grade.</p><p>Your answers save automatically. Leave and return on this same browser to continue.</p>${btn('Start 48-question practice exam','newMock()')}</section>`;return `<div class="note">${state.mock.submitted?'Completed practice attempt.':'Your unfinished answers are saved automatically on this device.'}</div>`+questionUI(exam,'mock')}
function backup(){return `<section class="card"><h2>Save or transfer progress</h2><p>Your progress is stored in this browser. It usually survives closing Canvas or restarting your computer, but it will not automatically transfer to another device or browser.</p><div class="actions">${btn('Export my progress (JSON)','exportProgress()')}${btn('Import progress file',"$('import-file').click()",'secondary')}</div><input id="import-file" class="hidden" type="file" accept=".json,application/json" onchange="importProgress(this.files[0])"><p class="small">Export a backup before changing devices or clearing browser data. Importing replaces progress on this device.</p><h3>Your saved results</h3>${STANDARDS.map(x=>`<p><strong>${x.id}. ${esc(x.name)}</strong> — ${state.completed.includes(x.id)?'Reviewed':'Not marked reviewed'}${state.results[x.id]?` • Latest topic practice: ${state.results[x.id].correct}/${state.results[x.id].total}`:''}</p>`).join('')}<h3>Mock exam history</h3>${state.history.length?state.history.map(h=>`<p>${esc(h.date.slice(0,10))}: ${h.score}/${h.total}</p>`).join(''):'<p>No completed mock exams yet.</p>'}</section>`}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'vet-cert-prep',version:1,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vet-cert-prep-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importProgress(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='vet-cert-prep'||data.version!==1||!data.state||!Array.isArray(data.state.completed))throw Error('Unrecognized progress file');if(!confirm('Replace this browser’s existing progress with the imported file?'))return;state={...state,...data.state};exam=[];answers={};save();nav('home');alert('Progress imported successfully.')}catch(e){alert('Unable to import this progress file: '+e.message)}}render();
</script></body></html>
